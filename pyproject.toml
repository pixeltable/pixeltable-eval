[project]
name = "pixeltable-eval"
version = "0.1.0"
description = "Eval harness measuring how well AI coding agents write Pixeltable code"
requires-python = ">=3.10"
dependencies = [
    "pixeltable>=0.6.0",
    "openai>=1.0",
    "anthropic>=0.40.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
include = ["eval*"]

[tool.ruff]
line-length = 100
target-version = "py310"
